# Supabase function deployment configuration.
# Calendar subscription clients (Google/Apple/Outlook) do not send a Supabase
# user JWT. The feed's high-entropy bearer token is validated inside the
# calendar-feed handler, so platform JWT verification must remain disabled.

[functions.calendar-feed]
verify_jwt = false

# Public readers open the share link in a plain browser with no Supabase JWT.
# The alias is validated inside the trip-share handler, so JWT verification
# must remain disabled.
[functions.trip-share]
verify_jwt = false
