<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>Ownly 行程 · Itinerary</title>
<style>
:root{color-scheme:light dark}
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;background:#f5f5f4;color:#1c1917;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){body{background:#1c1917;color:#f5f5f4}}
.msg{padding:24px;text-align:center;max-width:34rem}
.msg h1{font-size:16px;margin:0 0 6px}
.msg p{margin:0;font-size:13px;opacity:.7}
</style>
</head>
<body>
<div class="msg" id="msg">
  <h1>正在打开行程…</h1>
  <p>Loading itinerary…</p>
</div>
<script>
(function () {
  var API = 'https://blgwlycfcwvsupmqyqwn.supabase.co/functions/v1/trip-share/';
  var alias = new URLSearchParams(location.search).get('t') || '';
  var msg = document.getElementById('msg');

  function fail(text) {
    msg.innerHTML = '';
    var h = document.createElement('h1');
    h.textContent = '无法打开这个分享链接';
    var p = document.createElement('p');
    p.textContent = text;
    msg.appendChild(h);
    msg.appendChild(p);
  }

  if (!alias) {
    fail('链接缺少行程名。Missing trip name.');
    return;
  }

  fetch(API + encodeURIComponent(alias), { credentials: 'omit' })
    .then(function (res) {
      if (!res.ok) throw new Error('status ' + res.status);
      return res.text();
    })
    .then(function (html) {
      // Defence in depth: only render the known self-contained document shape,
      // never anything that could execute script in this origin.
      if (!/^\s*<!doctype html/i.test(html) || /<script[\s>]/i.test(html)) {
        throw new Error('unexpected payload');
      }
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      fail('链接不存在、已停用或暂时无法访问。 Link not found, disabled, or unreachable.');
    });
})();
</script>
</body>
</html>
