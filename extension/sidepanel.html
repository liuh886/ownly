<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ownly Capture</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <strong>Ownly</strong>
        <p id="topbarSubtitle">Maps 研究捕获 → Planner</p>
      </div>
      <div class="topbar-actions">
        <button id="langToggle" class="lang-btn" type="button" title="切换语言 / Switch Language">EN</button>
        <span id="pending" class="counter">0 待同步</span>
      </div>
    </header>

    <section class="panel stack">
      <div class="row" id="tripActiveRow">
        <label id="lblActiveTrip" class="label" for="tripSelect">当前行程</label>
        <select id="currencySelector" class="chip accent-chip" style="display: none; padding: 1px 4px; font-size: 10px; width: auto; min-width: 70px;" aria-label="Currency"></select>🗺️ 地图货币: THB</button>
      </div>
      <select id="tripSelect"></select>
      <details id="tripManageSection" class="new-trip">
        <summary id="sumTripManage">⚙️ 行程管理</summary>
        <div class="stack" style="margin-top: 8px;">
          <div class="manage-block" id="editTripSection" style="display: none;">
            <p class="manage-title" id="sumEditTrip">✏️ 编辑当前行程设置</p>
            <form id="editTripForm" class="stack" style="margin-top: 6px;">
              <label id="lblEditTripTitle">行程名称<input id="editTripTitle" required placeholder="例如：东京赏樱 2026" /></label>
              <div class="two">
                <label id="lblEditTripStart">开始日期<input id="editTripStart" type="date" required /></label>
                <label id="lblEditTripEnd">结束日期<input id="editTripEnd" type="date" required /></label>
              </div>
              <label id="lblEditTripDestinations">目的地<input id="editTripDestinations" placeholder="例如：东京, 浅草, 涩谷" /></label>
              <label id="lblEditTripTags">行程标签 / 收藏夹名<input id="editTripTags" placeholder="例如：TH26, 美食清单" /></label>
              <div class="two">
                <label id="lblEditTripCurrency">货币<input id="editTripCurrency" placeholder="THB / JPY / CNY" /></label>
                <label id="lblEditTripTransport">主要交通
                  <select id="editTripTransport">
                    <option value="transit">公共交通 (Transit)</option>
                    <option value="walking">步行 (Walking)</option>
                    <option value="driving">自驾 (Driving)</option>
                    <option value="bicycling">骑行 (Bicycling)</option>
                  </select>
                </label>
              </div>
              <div class="row" style="gap: 8px; margin-top: 4px;">
                <button id="btnSaveTripEdit" class="primary" type="submit" style="flex: 2; min-height: 32px; font-size: 11px;">✓ 保存行程修改</button>
                <button id="btnDeleteTrip" class="danger-btn" type="button" style="flex: 1; min-height: 32px;">🗑️ 删除行程</button>
              </div>
            </form>
          </div>

          <div class="manage-block" id="createTripSection">
            <p class="manage-title" id="sumCreateTrip">➕ 新建行程</p>
            <form id="tripForm" class="stack" style="margin-top: 6px;">
              <label id="lblTripTitle">行程名称<input id="tripTitle" required placeholder="例如：东京赏樱 2026" /></label>
              <div class="two">
                <label id="lblTripStart">开始日期<input id="tripStart" type="date" required /></label>
                <label id="lblTripEnd">结束日期<input id="tripEnd" type="date" required /></label>
              </div>
              <label id="lblTripDestinations">目的地<input id="tripDestinations" placeholder="例如：东京, 浅草, 涩谷" /></label>
              <label id="lblTripTags">行程标签 / 收藏夹名<input id="tripTags" placeholder="例如：TH26, 美食清单, Want to go" /></label>
              <div class="two">
                <label id="lblTripCurrency">货币<input id="tripCurrency" value="CNY" /></label>
                <label id="lblTripTransport">主要交通
                  <select id="tripTransport">
                    <option value="transit">公共交通 (Transit)</option>
                    <option value="walking">步行 (Walking)</option>
                    <option value="driving">自驾 (Driving)</option>
                    <option value="bicycling">骑行 (Bicycling)</option>
                  </select>
                </label>
              </div>
              <button id="btnCreateTrip" class="secondary" type="submit">创建并设为当前行程</button>
            </form>
          </div>

          <hr class="divider" />

          <div class="manage-block" id="bulkImportSection">
            <p class="manage-title" id="sumBulkImport">📥 批量导入 / 粘贴地点或列表链接</p>
            <div class="stack" style="margin-top: 6px;">
              <label id="lblBulkText">批量粘贴链接或地点名
                <textarea id="bulkInputText" rows="3" placeholder="每行一个链接或地点名：&#10;https://maps.google.com/...&#10;浅草寺&#10;东京塔"></textarea>
              </label>
              <button id="btnParseBulkImport" class="secondary" type="button">📥 解析并快速加入候选池</button>
            </div>
          </div>

          <hr class="divider" />

          <div class="manage-block" style="display: flex; gap: 6px; align-items: center;">
            <button id="btnBackupState" class="link" type="button">⬇️ 备份</button>
            <button id="btnRestoreState" class="link" type="button">⬆️ 恢复</button>
            <input id="fileRestoreState" type="file" accept="application/json,.json" style="display: none;" />
          </div>
        </div>
      </details>
    </section>

    <!-- Unified Smart List Capture Card -->
    <section id="smartListSection" class="panel stack match-banner" style="display: none;">
      <div class="row">
        <span id="smartListBadge" class="match-badge">🌟 自动匹配收藏夹</span>
        <span class="row" style="gap: 4px;">
          <span id="smartListCountBadge" class="badge highlight">0 个地点</span>
          <button id="btnCloseSmartList" class="link" type="button" title="收起 / Dismiss" style="color: var(--text-4); padding: 0 4px;">✕</button>
        </span>
      </div>
      <div id="smartListTitle" class="match-title">列表名称</div>
      <p id="smartListDesc" class="match-desc">检测到当前 Google 收藏夹与行程匹配</p>

      <div class="row" style="gap: 6px; margin-top: 4px;">
        <button id="btnSmartSyncAll" class="sync-btn" type="button" style="flex: 3;">⚡ 一键同步全部地点</button>
        <button id="btnToggleListPreview" class="secondary" type="button" style="flex: 2; font-size: 11px; min-height: 36px; padding: 0 6px;">📋 挑选地点</button>
      </div>

      <div id="smartListPreviewContainer" class="stack" style="display: none; margin-top: 6px; border-top: 1px dashed var(--accent-border-strong); padding-top: 8px;">
        <div id="batchListContainer" class="batch-list"></div>
        <div class="batch-controls">
          <button id="btnToggleSelectAll" class="secondary" type="button" style="min-height: 28px; font-size: 11px; padding: 0 8px;">全选 / 取消</button>
          <button id="btnBatchAdd" class="primary" type="button" style="min-height: 28px; font-size: 11px; padding: 0 10px;">➕ 添加所选</button>
        </div>
      </div>
    </section>

    <section class="panel current" id="placePanel">
      <div class="row">
        <span id="lblCurrentPlace" class="label">当前地点</span>
        <div style="display: flex; gap: 8px;">
          <button id="btnDismissPlace" class="link" type="button" style="color: var(--danger); display: none;">❌ 取消选中</button>
          <button id="refreshPlace" class="link" type="button">🔄 刷新</button>
        </div>
      </div>
      <div class="title-row">
        <span id="placeProvider" class="provider-badge" style="display: none;">🗺️ Maps</span>
        <h1 id="placeTitle">请在地图或页面中打开地点</h1>
      </div>
      <p id="placeUrl" class="url">在 Google Maps、Tabelog、小红书浏览时自动识别</p>
      <div id="placeCapturedBanner" class="status-banner" style="display: none;">
        <span id="txtCapturedBanner">✓ 该地点已在候选池中</span>
      </div>
      <div id="placeMetaBadges" class="meta-badges"></div>
    </section>

    <form id="captureForm" class="panel stack">
      <div class="two">
        <label id="lblKind">地点类别
          <select id="kind">
            <option value="attraction">观光景点</option>
            <option value="food">餐厅美食</option>
            <option value="cafe">咖啡甜品</option>
            <option value="stay">酒店住宿</option>
            <option value="shopping">购物商场</option>
            <option value="transit">交通中转</option>
            <option value="experience">体验活动</option>
            <option value="other">其它</option>
          </select>
        </label>
        <label id="lblRating">评分<input id="rating" type="number" min="1" max="5" step="0.1" placeholder="4.6" /></label>
      </div>

      <div class="two">
        <label id="lblPrice">人均价格 / 预算<input id="price" placeholder="例如：฿3,200 / 晚" /></label>
        <label id="lblDuration">预计停留 (分钟)<input id="duration" type="number" min="1" max="1440" inputmode="numeric" placeholder="90" /></label>
      </div>

      <label id="lblWhy">选择理由 (Why)<textarea id="why" rows="2" placeholder="为什么选这个地点？"></textarea></label>

      <div>
        <label id="lblQuickChips">快捷标签</label>
        <div id="quickChips" class="chips"></div>
      </div>

      <details id="captureAdvanced" class="new-trip">
        <summary id="captureAdvancedSummary">⚙️ 更多设置</summary>
        <div class="stack" style="margin-top: 8px;">
          <div class="two">
            <label id="lblDuration">预计停留 (分钟)<input id="duration" type="number" min="1" max="1440" inputmode="numeric" placeholder="90" /></label>
            <label id="lblWindow">偏好时段<input id="window" placeholder="上午 / 傍晚日落 / 晚上" /></label>
          </div>
          <!-- Hidden: quick chips write to these -->
          <input id="tags" type="hidden" />
          <input id="signals" type="hidden" />
          <input id="risks" type="hidden" />
        </div>
      </details>

      <div class="btn-row">
        <button id="btnCaptureSubmit" class="primary" type="submit">➕ 加入候选池</button>
        <button id="btnRemoveCandidate" class="danger-btn" type="button" style="display: none;">🗑️ 移出</button>
      </div>
    </form>

    <!-- Candidates Drawer -->
    <details id="candidatesDrawer" class="panel stack drawer" open>
      <summary>
        <span id="sumCandidatesDrawer">🗂️ 当前行程候选池</span>
        <span class="row" style="gap: 6px;">
          <span id="candidatesCountBadge" class="badge">0</span>
          <button id="btnBulkToggle" class="link" type="button" title="批量操作">☑️</button>
        </span>
      </summary>
      <input id="candidatesSearch" placeholder="🔍 搜索候选地点、区域或标签..." />
      <div id="candidatesFilterBar" class="filter-bar"></div>
      <div id="bulkActionBar" class="bulk-bar" style="display: none;">
        <select id="bulkDaySelect" class="day-select"></select>
        <select id="bulkPrioritySelect" class="bulk-select">
          <option value="">设为优先级…</option>
          <option value="must">必去 (Must)</option>
          <option value="want">想去 (Want)</option>
          <option value="optional">可选 (Optional)</option>
        </select>
        <button id="btnSelectAllCandidates" class="card-btn" type="button">☑️ 全选</button>
        <button id="btnBulkDelete" class="card-btn del" type="button">🗑️ 删除</button>
        <button id="btnBulkExit" class="link" type="button">退出</button>
      </div>
      <div id="candidatesListContainer" class="candidates-list"></div>
    </details>

    <p id="status" class="status visible" aria-live="polite">就绪。</p>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
