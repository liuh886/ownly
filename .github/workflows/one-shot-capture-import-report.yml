name: One-shot Capture import report refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/one-shot-capture-import-report.py'
      - '.github/workflows/one-shot-capture-import-report.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply refactor
        run: python scripts/one-shot-capture-import-report.py
      - name: Validate focused regression
        run: |
          npx tsc --noEmit
          npx vitest run src/domain/planner.test.ts src/extension/capture-state.test.ts src/extension/capture-import-report.test.ts src/services/PlannerRepository.schedule.test.ts src/services/PlannerRepository.thailand-golden-path.test.ts src/services/PlannerRepository.capture-import-report.test.ts
          npm run build:extension
      - name: Commit product changes and remove one-shot helpers
        run: |
          git rm .github/workflows/one-shot-capture-import-report.yml scripts/one-shot-capture-import-report.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs
          git commit -m 'fix(capture): preserve failed imports with full report'
          git push origin HEAD:main
