name: Release Obsidian Plugin

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:runtime-parity

      - name: Build Obsidian plugin
        run: npm run package:obsidian

      - name: Export standalone plugin source
        run: node scripts/export-obsidian-repo.mjs dist/obsidian-repo

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/obsidian/ownly/main.js
            dist/obsidian/ownly/styles.css

      # The Obsidian community review lints every *.ts in the submitted repo, so
      # the plugin lives in a dedicated repo that excludes the web app and the
      # Chrome extension. This push mirrors the computed plugin closure.
      - name: Sync plugin source to liuh886/ownly-obsidian
        env:
          PLUGIN_REPO_TOKEN: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
        run: |
          if [ -z "$PLUGIN_REPO_TOKEN" ]; then
            echo "OBSIDIAN_REPO_TOKEN is not configured; skipping plugin repo sync."
            exit 0
          fi
          cd dist/obsidian-repo
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "sync: ${GITHUB_REF_NAME}" || echo "no source changes to commit"
          git branch -M main
          git remote add origin "https://x-access-token:${PLUGIN_REPO_TOKEN}@github.com/liuh886/ownly-obsidian.git"
          git push -f origin main

      - name: Publish release in liuh886/ownly-obsidian
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "OBSIDIAN_REPO_TOKEN is not configured; skipping plugin release."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/obsidian/ownly/main.js \
            dist/obsidian/ownly/styles.css \
            dist/obsidian/ownly/manifest.json \
            --repo liuh886/ownly-obsidian \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
