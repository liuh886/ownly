name: Release Obsidian Plugin

# Sync mechanism: the dedicated plugin repo (liuh886/ownly-obsidian) mirrors a
# *release*, never raw development commits. Its default-branch manifest.json must
# always equal the latest released version, which is what the Obsidian community
# directory reads.
#
#   tag push  -> gate -> build -> export -> push source -> publish release assets
#   manual    -> same pipeline, source-only (dry_run=true builds without pushing)
#
# See docs/OBSIDIAN_PLUGIN_SYNC.md for the full contract.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and export only; do not push or publish'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

# Never race two force-pushes to the plugin repo.
concurrency:
  group: obsidian-plugin-sync
  cancel-in-progress: false

jobs:
  release-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that does not match manifest.json would publish an unreachable
      # version, so fail fast and loudly.
      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match manifest.json version '$MANIFEST_VERSION'." >&2
            exit 1
          fi

      - name: Validate
        run: npm run validate
      - run: npm run test:runtime-parity

      - name: Build Obsidian plugin package
        run: npm run package:obsidian

      - name: Export standalone plugin source
        run: npm run export:obsidian-repo

      # The exported tree is a copy of the plugin closure; prove it is
      # self-consistent (builds and passes release validation) before pushing.
      - name: Verify exported tree
        working-directory: dist/obsidian-repo
        run: |
          set -euo pipefail
          node esbuild.obsidian.mjs --production
          node scripts/package-obsidian-plugin.mjs
          node scripts/validate-obsidian-release.mjs

      - name: Generate artifact attestation
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/obsidian/ownly/main.js
            dist/obsidian/ownly/styles.css

      - name: Sync plugin source to liuh886/ownly-obsidian
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          PLUGIN_REPO_TOKEN: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
        run: |
          if [ -z "$PLUGIN_REPO_TOKEN" ]; then
            echo "OBSIDIAN_REPO_TOKEN is not configured; skipping plugin repo sync."
            exit 0
          fi
          cd dist/obsidian-repo
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "sync: ${GITHUB_REF_NAME}" || echo "no source changes to commit"
          git branch -M main
          git remote add origin "https://x-access-token:${PLUGIN_REPO_TOKEN}@github.com/liuh886/ownly-obsidian.git"
          git push -f origin main

      - name: Publish release in liuh886/ownly-obsidian
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "OBSIDIAN_REPO_TOKEN is not configured; skipping plugin release."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/obsidian/ownly/main.js \
            dist/obsidian/ownly/styles.css \
            dist/obsidian/ownly/manifest.json \
            --repo liuh886/ownly-obsidian \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
