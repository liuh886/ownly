name: Apply PR 132

on:
  push:
    branches:
      - feat/planner-execution-timeline
    paths:
      - '.github/workflows/pr132-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/planner-execution-timeline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply execution timeline implementation
        run: python .github/pr132-apply.py

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Validate MCP package
        run: |
          npm install --prefix packages/mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/mcp
          node packages/mcp/dist/index.js --help

      - name: Validate configured OpenRouteService secret
        env:
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.OPENROUTESERVICE_API_KEY || '';
          if (!key) throw new Error('OPENROUTESERVICE_API_KEY repository secret is missing.');
          const response = await fetch('https://api.heigit.org/openrouteservice/v2/matrix/foot-walking', {
            method: 'POST',
            headers: {
              Authorization: key,
              'Content-Type': 'application/json',
              Accept: 'application/json',
            },
            body: JSON.stringify({
              locations: [[100.4927, 13.7466], [100.5018, 13.7516]],
              metrics: ['duration'],
            }),
          });
          if (!response.ok) throw new Error(`OpenRouteService smoke request failed (${response.status}).`);
          const body = await response.json();
          if (!Array.isArray(body.durations) || !Number.isFinite(body.durations?.[0]?.[1])) {
            throw new Error('OpenRouteService smoke response has no usable duration matrix.');
          }
          console.log('OpenRouteService repository secret validated with a live matrix request.');
          NODE

      - name: Diff sanity
        run: git diff --check

      - name: Commit product implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr132-apply.py .github/workflows/pr132-apply.yml
          git add docs/MCP.md docs/PLANNER.md package.json packages/mcp/package.json packages/mcp/src/index.mjs scripts/mcp/planner-tools.ts server.json src/components/planner/PlannerHome.tsx src/domain/planner-schedule.ts src/domain/planner-schedule.test.ts
          git commit -m 'feat(planner): project canonical execution timeline'
          git push origin HEAD:feat/planner-execution-timeline
