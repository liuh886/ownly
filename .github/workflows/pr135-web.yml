name: Validate PR 135 core

on:
  push:
    branches: [refactor/planner-repeatable-visits]
    paths:
      - '.github/workflows/pr135-web.yml'
      - '.github/pr135-web.py'
      - '.github/pr135-core.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/planner-repeatable-visits
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python .github/pr135-core.py
      - run: npm ci
      - run: npm run validate:fast
      - run: npm run build:web
      - run: npm run test -- --run src/services/PlannerRepository.schedule.test.ts src/domain/ical-pro.test.ts
