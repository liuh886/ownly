name: Land repeatable Planner visits

on:
  push:
    branches: [refactor/planner-repeatable-visits]
    paths:
      - '.github/workflows/pr135-web.yml'

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/planner-repeatable-visits
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Materialize validated Visit implementation
        run: |
          python .github/pr135-finalize.py
          python .github/pr135-fix2.py
          python .github/pr135-fix3.py
          python .github/pr135-fix4.py
          python .github/pr135-authority.py
          python .github/pr135-fix5.py
          python .github/pr135-capturefix.py
          python .github/pr135-finalfix.py
          python .github/pr135-guardfix.py
          python .github/pr135-land.py
      - name: Install dependencies
        run: npm ci
      - name: Full repository validation
        run: npm run validate
      - name: MCP package contract
        run: |
          npm install --prefix packages/mcp --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/mcp
          node packages/mcp/dist/index.js --help
          (cd packages/mcp && npm pack --dry-run)
      - name: Final tree guards
        run: |
          git diff --check
          test -f src/domain/planner-visits.ts
          test ! -e .github/pr135-finalize.py
          test ! -e .github/pr135-land.py
          test ! -e .github/pr135-capturefix.py
          test ! -e .github/pr135-finalfix.py
          test ! -e .github/pr135-guardfix.py
          test ! -e .github/workflows/pr135-web.yml
          ! sed -n '/export interface PlannerTripPlace {/,/export interface PlannerScheduledPlace/p' src/domain/planner.ts | grep -q 'scheduled_date?: string;'
          ! sed -n '/export interface PlannerTripPlace {/,/export interface PlannerScheduledPlace/p' src/domain/planner.ts | grep -q 'scheduled_start?: string;'
          ! grep -q 'updatePlaceTiming(' src/services/PlannerRepository.ts
          grep -q 'allows the same place multiple times on the same day and across days' src/services/PlannerRepository.schedule.test.ts
          grep -q 'removes only the selected occurrence and keeps the place plus other visits' src/services/PlannerRepository.schedule.test.ts
          grep -q 'ownly_planner_prepare_add_visit' packages/mcp/src/index.mjs
          grep -q 'ownly_planner_prepare_remove_visit' packages/mcp/src/index.mjs
          grep -q "not.toHaveProperty(key)" src/extension/capture-state.test.ts
      - name: Commit production tree
        run: |
          rm -f src/core/git-sha.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'refactor(planner): make visits the scheduling authority'
          git push origin HEAD:refactor/planner-repeatable-visits
