name: Validate PR 135 repeatable visits

on:
  push:
    branches: [refactor/planner-repeatable-visits]
    paths:
      - '.github/workflows/pr135-web.yml'
      - '.github/pr135-web.py'
      - '.github/pr135-core.py'
      - '.github/pr135-finalize.py'
      - '.github/pr135-fix2.py'
      - '.github/pr135-fix3.py'
      - '.github/pr135-fix4.py'
      - '.github/pr135-authority.py'
      - '.github/pr135-fix5.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/planner-repeatable-visits
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python .github/pr135-finalize.py
      - run: python .github/pr135-fix2.py
      - run: python .github/pr135-fix3.py
      - run: python .github/pr135-fix4.py
      - run: python .github/pr135-authority.py
      - run: python .github/pr135-fix5.py
      - run: npm ci
      - run: npm run validate:fast
      - run: npm run build
      - run: npm run test -- --run src/domain/planner.test.ts src/services/PlannerRepository.schedule.test.ts src/domain/ical-pro.test.ts src/domain/planner-schedule.test.ts src/domain/planner-route-time.test.ts scripts/mcp/planner-tools.test.ts scripts/shared/ownly-write-service.test.ts
