name: Refresh Security Lockfile

on:
  push:
    branches:
      - agent/security-audit-dependencies
    paths:
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/security-audit-dependencies

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js and compatible transitive fixes
        run: |
          npm install next@16.2.12 --save-exact
          npm audit fix --package-lock-only

      - name: Verify production audit
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node scripts/summarize-npm-audit.mjs npm-audit-production.json "Updated production dependency tree"
          node scripts/enforce-production-audit.mjs npm-audit-production.json

      - name: Commit lockfile refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): upgrade Next.js and refresh dependency lockfile"
          git push origin HEAD:agent/security-audit-dependencies
