name: Release preflight identity authority

on:
  push:
    branches:
      - release/preflight-identity-authority
    paths:
      - .github/workflows/release-preflight-identity-authority.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/preflight-identity-authority

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply release preflight patch
        run: python .github/scripts/release_preflight_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate release preflight changes
        run: |
          npm run validate:fast
          npx vitest run src/domain/place-identity.test.ts src/domain/planner.test.ts src/services/PlannerRepository.schedule.test.ts src/services/PlannerRepository.thailand-golden-path.test.ts
          npm run validate:extension

      - name: Commit verified release preflight changes
        shell: bash
        run: |
          git config user.name "ownly-agent"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/release-preflight-identity-authority.yml
          rm .github/scripts/release_preflight_patch.py
          git add src/domain/place-identity.ts src/domain/place-identity.test.ts src/domain/planner.ts src/services/PlannerRepository.ts src/services/PlannerRepository.schedule.test.ts src/components/planner/PlannerHome.tsx docs/RELEASE_READINESS.md .github/workflows/release-preflight-identity-authority.yml .github/scripts/release_preflight_patch.py
          git commit -m "fix(planner): establish place identity authority and release preflight"
          git push origin HEAD:release/preflight-identity-authority
