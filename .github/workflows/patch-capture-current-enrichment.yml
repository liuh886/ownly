name: Patch capture current enrichment

on:
  push:
    branches:
      - refactor/capture-data-quality-20260829

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/patch_capture_current_enrichment.py
      - run: npm run validate:fast
      - run: npm run validate:extension
      - name: Commit validated product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/extension/content.ts
          git commit -m "fix: wire Google Maps detail enrichment into Capture [skip ci]" || exit 0
          git push origin HEAD:refactor/capture-data-quality-20260829
