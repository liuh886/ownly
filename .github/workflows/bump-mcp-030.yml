name: Bump MCP 0.3.0

on:
  push:
    branches:
      - main
    paths:
      - scripts/bump_mcp_030.py
      - .github/workflows/bump-mcp-030.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply version bump
        run: python scripts/bump_mcp_030.py
      - name: Validate release metadata
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          SERVER_PACKAGE_VERSION=$(node -p "require('./server.json').packages[0].version")
          test "$PACKAGE_VERSION" = "0.3.0"
          test "$PACKAGE_VERSION" = "$SERVER_VERSION"
          test "$PACKAGE_VERSION" = "$SERVER_PACKAGE_VERSION"
          grep -F "const SERVER_VERSION = '0.3.0';" packages/mcp/src/index.mjs
      - name: Build package
        run: |
          npm install --prefix packages/mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/mcp
          node packages/mcp/dist/index.js --help
          cd packages/mcp
          npm pack --dry-run
      - name: Commit release bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/mcp/package.json packages/mcp/src/index.mjs server.json
          git commit -m "chore(mcp): release 0.3.0"
          git push origin HEAD:main
