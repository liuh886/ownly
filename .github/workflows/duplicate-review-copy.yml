name: Duplicate review copy preflight

on:
  push:
    branches:
      - release/preflight-duplicate-copy
    paths:
      - .github/workflows/duplicate-review-copy.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/preflight-duplicate-copy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply copy cleanup
        run: python .github/scripts/duplicate_review_copy.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate:fast
      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "ownly-agent"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/duplicate-review-copy.yml
          rm .github/scripts/duplicate_review_copy.py
          git add src/components/planner/PlannerHome.tsx .github/workflows/duplicate-review-copy.yml .github/scripts/duplicate_review_copy.py
          git commit -m "fix(planner): clarify duplicate review authority"
          git push origin HEAD:release/preflight-duplicate-copy
