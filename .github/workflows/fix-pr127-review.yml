name: Fix PR 127 review

on:
  push:
    branches:
      - feat/planner-core-milestones-1-5
    paths:
      - scripts/fix_pr127_review.py
      - .github/workflows/fix-pr127-review.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply review corrections
        run: |
          python scripts/fix_pr127_review.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/planner.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("expect(md).toContain('¥4,500 JPY');", "expect(md).toContain('¥4500 JPY');")
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm run validate:fast
      - run: npm run validate:shared
      - run: npm run validate:web
      - run: npm run validate:obsidian
      - run: npm run validate:extension
      - name: Commit validated product corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/planner.ts src/domain/planner.test.ts src/services/PlannerRepository.ts src/components/planner/PlannerHome.tsx src/components/planner/ImportCandidatesModal.tsx
          git commit -m "fix(planner): preserve estimate and ledger semantics [skip ci]"
          git push origin HEAD:feat/planner-core-milestones-1-5
