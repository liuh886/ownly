name: Apply PR 131

on:
  push:
    branches:
      - feat/planner-travel-time-optimization
    paths:
      - '.github/workflows/pr131-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/planner-travel-time-optimization
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply PR 131 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/pr131-apply.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "re.subn(pattern, repl, text, count=1, flags=re.S)",
              "re.subn(pattern, lambda _match: repl, text, count=1, flags=re.S)",
          )
          text = text.replace(
              "for path in ['package.json', 'packages/mcp/package.json', 'server.json']:",
              "for path in ['packages/mcp/package.json', 'server.json']:",
          )
          path.write_text(text, encoding='utf-8')
          PY
          python .github/pr131-apply.py
          python .github/pr131-fix-web.py
          python .github/pr131-fix-contract.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/mcp/openrouteservice.ts')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Validate MCP package build
        run: |
          npm install --prefix packages/mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/mcp
          node packages/mcp/dist/index.js --help

      - name: Diff sanity
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MCP.md docs/PLANNER.md packages/mcp/package.json packages/mcp/src/index.mjs scripts/cli/planner-storage.ts scripts/mcp/openrouteservice.ts scripts/mcp/openrouteservice.test.ts scripts/shared/ownly-write-service.ts server.json src/components/planner/PlannerHome.tsx src/domain/planner-route-time.ts src/domain/planner-route-time.test.ts src/domain/planner.ts src/domain/planner.test.ts src/domain/route.ts
          git commit -m 'feat(planner): optimize day order by travel time'
          git push origin HEAD:feat/planner-travel-time-optimization
