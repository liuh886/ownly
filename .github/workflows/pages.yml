name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.web }}
    env:
      OWNLY_BASE_PATH: /ownly
      NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
    steps:
      - name: Checkout change history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify affected runtimes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "obsidian=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed-files.txt
          cat changed-files.txt

          full=false
          shared=false
          web=false
          obsidian=false
          mcp=false

          if grep -Eq '^(package(-lock)?\.json|tsconfig.*\.json|eslint\.config\.|\.github/workflows/pages\.yml)' changed-files.txt; then
            full=true
          fi
          if [[ "$full" == true ]] || grep -Eq '^(src/(core|services|types)/|scripts/cli/|scripts/wyqd-cli\.ts|tests/|docs/(DATA|WEB_RUNTIME|AGENT_CLI)|.*migration)' changed-files.txt; then
            shared=true
          fi
          if grep -Eq '^(packages/mcp/|scripts/mcp/)' changed-files.txt; then
            mcp=true
          fi
          if [[ "$full" == true || "$shared" == true ]] || grep -Eq '^(src/(app|components|hooks|lib)/|public/|next\.config|postcss\.config|scripts/(gen-git-sha|validate-static-export|validate-pwa|validate-membership)\.mjs)' changed-files.txt; then
            web=true
          fi
          if [[ "$full" == true || "$shared" == true ]] || grep -Eq '^(src/obsidian/|esbuild\.obsidian\.mjs|manifest\.json|styles\.css|scripts/(package-obsidian-plugin|validate-obsidian-release)\.mjs)' changed-files.txt; then
            obsidian=true
          fi

          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "obsidian=$obsidian" >> "$GITHUB_OUTPUT"
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
          if [[ "$shared" == true || "$web" == true || "$obsidian" == true || "$mcp" == true ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.any == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.scope.outputs.any == 'true'
        run: npm ci --no-audit --no-fund

      - name: Fast repository validation
        if: steps.scope.outputs.any == 'true'
        run: npm run validate:fast

      - name: Shared data, CLI and portability contracts
        if: steps.scope.outputs.shared == 'true'
        run: npm run validate:shared

      - name: MCP adapter contract
        if: steps.scope.outputs.mcp == 'true' && steps.scope.outputs.shared != 'true'
        run: npm run test:mcp

      - name: Install MCP package dependencies
        if: steps.scope.outputs.mcp == 'true'
        run: npm install --prefix packages/mcp --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build and validate MCP package
        if: steps.scope.outputs.mcp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix packages/mcp
          node packages/mcp/dist/index.js --help | grep -F "Ownly MCP"
          npm pack --prefix packages/mcp --dry-run

      - name: Web and PWA validation
        if: steps.scope.outputs.web == 'true'
        run: npm run validate:web

      - name: Obsidian plugin validation
        if: steps.scope.outputs.obsidian == 'true'
        run: npm run validate:obsidian

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && steps.scope.outputs.web == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
