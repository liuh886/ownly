name: Apply planner pool integrity hotfix v3

on:
  push:
    branches:
      - fix/planner-pool-integrity-actions
    paths:
      - .github/workflows/planner-pool-integrity-hotfix-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/planner-pool-integrity-actions

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply code patch and regression update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/planner-pool-integrity-hotfix.yml').read_text()
          step = workflow.index('      - name: Apply focused code changes')
          run_start = workflow.index('        run: |\n', step) + len('        run: |\n')
          run_end = workflow.index('\n      - name: Install dependencies', run_start)
          block = workflow[run_start:run_end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          subprocess.run(['bash', '-lc', script], check=True)

          test_path = Path('src/services/PlannerRepository.schedule.test.ts')
          test = test_path.read_text()
          anchors = [
              ("  it('deduplicates places by Place ID, CID, and emoji/canonical title', async () => {", "  it('keeps title-only matches separate until a strong identity proves they are duplicates', async () => {"),
              ("    // Should NOT create duplicate, should merge into single authoritative place", "    // Same/similar titles are weak evidence: keep both until a strong source identity proves duplication."),
              ("    expect(thipPlaces).toHaveLength(1);", "    expect(thipPlaces).toHaveLength(2);"),
              ("    expect(thipPlaces[0].source_place_id).toBe('0x30e2991678584ec5:0x698c069655046fbe');\n    expect(thipPlaces[0].observed_rating).toBe(4.2);\n    expect(thipPlaces[0].notes).toBe('Initial note');", "    const preservedInitial = thipPlaces.find((p) => p.id === 'p-thip-1');\n    const capturedPlace = thipPlaces.find((p) => p.id === 'p-thip-new');\n    expect(preservedInitial?.notes).toBe('Initial note');\n    expect(capturedPlace?.source_place_id).toBe('0x30e2991678584ec5:0x698c069655046fbe');\n    expect(capturedPlace?.observed_rating).toBe(4.2);"),
          ]
          for old, new in anchors:
              if old not in test:
                  raise SystemExit(f'missing test patch anchor: {old[:50]}')
              test = test.replace(old, new, 1)
          test_path.write_text(test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and planner regressions
        run: |
          npm run validate:fast
          npx vitest run src/domain/planner.test.ts src/services/PlannerRepository.schedule.test.ts

      - name: Commit verified changes and remove one-shot workflows
        shell: bash
        run: |
          git config user.name "ownly-agent"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/planner-pool-integrity-hotfix.yml
          rm .github/workflows/planner-pool-integrity-hotfix-v2.yml
          rm .github/workflows/planner-pool-integrity-hotfix-v3.yml
          git add src/components/planner/PlannerHome.tsx src/services/PlannerRepository.ts src/services/PlannerRepository.schedule.test.ts .github/workflows/planner-pool-integrity-hotfix.yml .github/workflows/planner-pool-integrity-hotfix-v2.yml .github/workflows/planner-pool-integrity-hotfix-v3.yml
          git commit -m "fix(planner): preserve shelved places and tighten pool actions"
          git push origin HEAD:fix/planner-pool-integrity-actions
