name: Implement PR 130

on:
  push:
    branches:
      - feat/planner-travel-leg-feasibility
    paths:
      - '.github/workflows/pr130-implement.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/planner-travel-leg-feasibility
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply final contract polish
        run: python .github/pr130-polish.py

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Validate MCP package build
        run: |
          npm install --prefix packages/mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/mcp
          node packages/mcp/dist/index.js --help

      - name: Diff sanity
        run: git diff --check

      - name: Commit final contract polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PLANNER.md packages/mcp/src/index.mjs src/components/planner/PlannerHome.tsx
          git commit -m 'fix(planner): make route facts explicit and attributable'
          git push origin HEAD:feat/planner-travel-leg-feasibility
