name: Apply Capture Enrichment Authority Fix

on:
  push:
    branches:
      - fix/capture-enrichment-authority

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply focused patch
        run: python .github/tmp-fix-capture-authority.py

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/tmp-fix-capture-authority.py
          rm .github/workflows/tmp-fix-capture-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): keep enrichment facts-only and race-safe"
          git push origin HEAD:fix/capture-enrichment-authority
