name: Refactor Capture Planner Boundary

on:
  push:
    branches:
      - refactor/capture-planner-boundary-20260829

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/capture-planner-boundary-20260829
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply refactor
        run: |
          python scripts/patch_refactor_driver.py
          python scripts/refactor_capture_boundary.py
          python scripts/post_refactor_fixes.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Fast validation
        run: npm run validate:fast

      - name: Shared validation
        run: npm run validate:shared

      - name: Web validation
        run: npm run validate:web

      - name: Extension validation
        run: npm run validate:extension

      - name: Remove staging automation
        run: rm scripts/refactor_capture_boundary.py scripts/patch_refactor_driver.py scripts/post_refactor_fixes.py .github/workflows/refactor-capture-boundary.yml

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make Planner the travel state authority"
          git push origin HEAD:refactor/capture-planner-boundary-20260829
