name: Apply planner pool integrity hotfix

on:
  push:
    branches:
      - fix/planner-pool-integrity-actions
    paths:
      - .github/workflows/planner-pool-integrity-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/planner-pool-integrity-actions

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused code changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          repo_path = Path('src/services/PlannerRepository.ts')
          repo = repo_path.read_text()

          # Strong identity only: title similarity belongs in suspected-duplicate review,
          # never in automatic import/dedup where it can swallow distinct branches/airports.
          helper_pattern = re.compile(
              r"\nconst GENERIC_TITLES = new Set\(\[.*?\nfunction coordinateClusterKey\(place: PlannerTripPlace\): string \| null \{.*?\n\}\n",
              re.S,
          )
          repo, n = helper_pattern.subn('\n', repo, count=1)
          if n != 1:
              raise SystemExit('missing patch anchor: title/coordinate helper block')

          repo = replace_once(repo, "    const byTitle = new Map<string, PlannerTripPlace>();\n", "", 'byTitle declaration')
          repo = replace_once(repo, "    const byCoordinates = new Map<string, PlannerTripPlace>();\n", "", 'byCoordinates declaration')
          repo = replace_once(
              repo,
              "      const cleanTitle = canonicalizePlaceTitle(place.title);\n      if (cleanTitle.length >= 2) byTitle.set(`${place.trip_id}::${cleanTitle}`, place);\n",
              "",
              'title index',
          )
          repo = replace_once(
              repo,
              "      const geo = coordinateClusterKey(place);\n      if (geo) byCoordinates.set(geo, place);\n",
              "",
              'coordinate index',
          )
          repo = replace_once(
              repo,
              "      const incomingTitle = isDistinctCanonicalTitle(incoming.title) ? canonicalizePlaceTitle(incoming.title) : '';\n",
              "",
              'incoming title identity',
          )
          repo = replace_once(
              repo,
              "        ?? (incomingTitle ? byTitle.get(`${incoming.trip_id}::${incomingTitle}`) : undefined)\n",
              "",
              'title import merge',
          )
          repo = replace_once(
              repo,
              "   * Scans all places in a trip, identifies duplicate entities (by Place ID, CID, distinct canonical title, or URL Identity),\n",
              "   * Scans all places in a trip and auto-merges only strong duplicate identities (Place ID, CID, or canonical source URL).\n",
              'dedup documentation',
          )
          repo = replace_once(
              repo,
              "      const title1 = isDistinctCanonicalTitle(p1.title) ? canonicalizePlaceTitle(p1.title) : '';\n\n",
              "",
              'dedup title1',
          )
          repo = replace_once(
              repo,
              "        const title2 = isDistinctCanonicalTitle(p2.title) ? canonicalizePlaceTitle(p2.title) : '';\n\n",
              "",
              'dedup title2',
          )
          repo = replace_once(
              repo,
              "          || (title1 && title2 && title1 === title2)\n",
              "",
              'dedup title equality',
          )
          repo_path.write_text(repo)

          planner_path = Path('src/components/planner/PlannerHome.tsx')
          planner = planner_path.read_text()

          planner = replace_once(
              planner,
              "\n  const [isDroppedCollapsed, setIsDroppedCollapsed] = useState(true);\n",
              "\n",
              'dropped collapsed state',
          )
          planner = replace_once(
              planner,
              "  const tripPlaces = useMemo(\n    () => places.filter((place) => place.trip_id === selectedTripId && place.state !== 'dropped'),\n    [places, selectedTripId],\n  );\n",
              "  // Keep the complete trip place set in memory. UI projections decide whether a\n  // place is active or shelved; dropping must never make a place disappear.\n  const tripPlaces = useMemo(\n    () => places.filter((place) => place.trip_id === selectedTripId),\n    [places, selectedTripId],\n  );\n",
              'tripPlaces dropped filter',
          )
          planner = replace_once(
              planner,
              "  const suspectedDuplicatePairs = useMemo(\n    () => detectSuspectedDuplicatePlaces(tripPlaces),\n    [tripPlaces],\n  );\n",
              "  const suspectedDuplicatePairs = useMemo(\n    () => detectSuspectedDuplicatePlaces(tripPlaces.filter((place) => place.state !== 'dropped')),\n    [tripPlaces],\n  );\n",
              'suspected duplicate active projection',
          )

          want_anchor = "    const wantCount = pendingCandidates.filter((p) => p.priority === 'want').length;\n    if (wantCount > 0) chips.push({ id: 'want', label: zh ? '想去' : 'Want', count: wantCount, type: 'priority' });\n\n"
          want_replacement = want_anchor + "    if (droppedPlaces.length > 0) {\n      chips.push({ id: 'dropped', label: zh ? '🙈 暂不考虑' : '🙈 Shelved', count: droppedPlaces.length, type: 'status' });\n    }\n\n"
          planner = replace_once(planner, want_anchor, want_replacement, 'shelved filter chip')
          planner = replace_once(
              planner,
              "  }, [pendingCandidates, zh, language, tripTags, visitCountByPlaceId]);\n",
              "  }, [pendingCandidates, droppedPlaces, zh, language, tripTags, visitCountByPlaceId]);\n",
              'filter chip dependencies',
          )
          planner = replace_once(
              planner,
              "  const scheduledAll = useMemo(\n    () => materializePlannerScheduledPlaces(\n      tripPlaces,\n      tripVisits,\n    ),\n    [tripPlaces, tripVisits],\n  );\n",
              "  const scheduledAll = useMemo(\n    () => materializePlannerScheduledPlaces(\n      tripPlaces.filter((place) => place.state !== 'dropped'),\n      tripVisits,\n    ),\n    [tripPlaces, tripVisits],\n  );\n",
              'scheduled active projection',
          )

          old_sorted = "  const sortedPendingCandidates = useMemo(() => {\n    const filtered = filterAndSearchPlaces(pendingCandidates, activeFilter, poolSearch, visitCountByPlaceId);\n    return sortPlaceList(filtered, candidateSortMode, candidateDistances, lastStopCoords);\n  }, [pendingCandidates, activeFilter, poolSearch, candidateSortMode, candidateDistances, lastStopCoords, visitCountByPlaceId]);\n\n  const sortedDroppedPlaces = useMemo(() => {\n    const filtered = filterAndSearchPlaces(droppedPlaces, activeFilter, poolSearch);\n    return sortPlaceList(filtered, candidateSortMode, candidateDistances, lastStopCoords);\n  }, [droppedPlaces, activeFilter, poolSearch, candidateSortMode, candidateDistances, lastStopCoords]);\n"
          new_sorted = "  const sortedPendingCandidates = useMemo(() => {\n    const poolSource = activeFilter === 'dropped' ? droppedPlaces : pendingCandidates;\n    const filtered = filterAndSearchPlaces(poolSource, activeFilter, poolSearch, visitCountByPlaceId);\n    return sortPlaceList(filtered, candidateSortMode, candidateDistances, lastStopCoords);\n  }, [pendingCandidates, droppedPlaces, activeFilter, poolSearch, candidateSortMode, candidateDistances, lastStopCoords, visitCountByPlaceId]);\n"
          planner = replace_once(planner, old_sorted, new_sorted, 'pool source projection')

          planner = replace_once(
              planner,
              "                {sortedPendingCandidates.length}/{pendingCandidates.length}\n",
              "                {sortedPendingCandidates.length}/{activeFilter === 'dropped' ? droppedPlaces.length : pendingCandidates.length}\n",
              'pool count denominator',
          )

          # Header actions steal title width. Move schedule/shelve to the footer action cluster.
          old_header_actions = """                          {!isMultiSelectMode ? (\n                            <div className=\"flex items-center gap-1 shrink-0\">\n                              <button\n                                type=\"button\"\n                                onClick={(e) => {\n                                  e.stopPropagation();\n                                  void schedulePlace(place.id);\n                                }}\n                                className=\"flex h-6 w-6 items-center justify-center rounded-md bg-stone-900 text-xs font-bold text-white hover:bg-stone-800 transition shadow-2xs\"\n                                title={zh ? '直接排入当天日程' : 'Schedule to active day'}\n                              >\n                                +\n                              </button>\n                              <button\n                                type=\"button\"\n                                onClick={(e) => {\n                                  e.stopPropagation();\n                                  void handleDropPlace(place.id);\n                                }}\n                                className=\"flex h-6 w-6 items-center justify-center rounded-md border border-stone-200 bg-stone-50 text-xs text-stone-400 hover:text-stone-700 hover:border-stone-300 transition shadow-2xs\"\n                                title={zh ? '设为暂不考虑，可随时在下方折叠区中重新考虑' : 'Shelve this place, recoverable anytime below'}\n                              >\n                                🙈\n                              </button>\n                            </div>\n                          ) : null}\n"""
          planner = replace_once(planner, old_header_actions, "", 'candidate header actions')

          planner = planner.replace("draggable={!isMultiSelectMode}", "draggable={!isMultiSelectMode && place.state !== 'dropped'}")
          planner = planner.replace("if (isMultiSelectMode) return;\n                        event.dataTransfer.setData('text/plain', place.id);", "if (isMultiSelectMode || place.state === 'dropped') return;\n                        event.dataTransfer.setData('text/plain', place.id);")

          # Phone is icon-only; the number remains available as tooltip/call target.
          planner = planner.replace("title={zh ? '拨打官方电话' : 'Call'}", "title={place.phone}")
          planner = planner.replace("📞 {place.phone}", "📞")

          old_delete = """                        <button\n                          type=\"button\"\n                          onClick={(e) => {\n                            e.stopPropagation();\n                            void handleDeletePlace(place.id, place.title);\n                          }}\n                          className=\"flex h-5.5 w-5.5 items-center justify-center text-xs text-stone-300 hover:text-rose-600 hover:bg-rose-50 rounded transition shrink-0\"\n                          title={zh ? '彻底从行程中删除此地点' : 'Delete place permanently'}\n                        >\n                          🗑️\n                        </button>\n"""
          new_actions = """                        <div className=\"flex items-center gap-1 shrink-0\">\n                          {place.state === 'dropped' ? (\n                            <button\n                              type=\"button\"\n                              onClick={(e) => {\n                                e.stopPropagation();\n                                void handleRestorePlace(place.id);\n                              }}\n                              className=\"inline-flex h-6 items-center justify-center gap-1 rounded-md border border-emerald-300 bg-emerald-50 px-2 text-[10px] font-bold text-emerald-800 hover:bg-emerald-100 transition\"\n                              title={zh ? '取回到候选池' : 'Restore to candidate pool'}\n                            >\n                              ↩️ {zh ? '取回' : 'Restore'}\n                            </button>\n                          ) : (\n                            <>\n                              <button\n                                type=\"button\"\n                                onClick={(e) => {\n                                  e.stopPropagation();\n                                  void schedulePlace(place.id);\n                                }}\n                                className=\"flex h-6 w-6 items-center justify-center rounded-md bg-stone-900 text-xs font-bold text-white hover:bg-stone-800 transition shadow-2xs\"\n                                title={zh ? '直接排入当天日程' : 'Schedule to active day'}\n                              >\n                                +\n                              </button>\n                              <button\n                                type=\"button\"\n                                onClick={(e) => {\n                                  e.stopPropagation();\n                                  void handleDropPlace(place.id);\n                                }}\n                                className=\"flex h-6 w-6 items-center justify-center rounded-md border border-stone-200 bg-stone-50 text-xs text-stone-400 hover:text-stone-700 hover:border-stone-300 transition shadow-2xs\"\n                                title={zh ? '暂不考虑' : 'Shelve'}\n                              >\n                                🙈\n                              </button>\n                            </>\n                          )}\n                          <button\n                            type=\"button\"\n                            onClick={(e) => {\n                              e.stopPropagation();\n                              void handleDeletePlace(place.id, place.title);\n                            }}\n                            className=\"flex h-6 w-6 items-center justify-center text-xs text-stone-300 hover:text-rose-600 hover:bg-rose-50 rounded transition\"\n                            title={zh ? '彻底从行程中删除此地点' : 'Delete place permanently'}\n                          >\n                            🗑️\n                          </button>\n                        </div>\n"""
          planner = replace_once(planner, old_delete, new_actions, 'candidate footer actions')

          # Remove the old hidden collapsible shelved layer. Shelved places are now a first-class filter.
          start_marker = "            {/* Layer 3: 暂不考虑 Collapsible Section */}"
          end_marker = "            ) : null}\n          </>"
          start = planner.find(start_marker)
          if start < 0:
              raise SystemExit('missing patch anchor: old shelved layer start')
          end = planner.find(end_marker, start)
          if end < 0:
              raise SystemExit('missing patch anchor: old shelved layer end')
          planner = planner[:start] + planner[end + len("            ) : null}\n"):]

          planner_path.write_text(planner)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and focused planner tests
        run: |
          npm run validate:fast
          npx vitest run src/domain/planner.test.ts src/services/PlannerRepository.schedule.test.ts

      - name: Commit landed changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "ownly-agent"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/planner-pool-integrity-hotfix.yml
          git add src/components/planner/PlannerHome.tsx src/services/PlannerRepository.ts .github/workflows/planner-pool-integrity-hotfix.yml
          git commit -m "fix(planner): preserve shelved places and tighten pool actions"
          git push origin HEAD:fix/planner-pool-integrity-actions
