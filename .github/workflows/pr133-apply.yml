name: Apply PR 133

on:
  push:
    branches:
      - fix/capture-google-maps-spa
    paths:
      - '.github/workflows/pr133-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/capture-google-maps-spa
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python .github/pr133-apply.py
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:extension
      - run: git diff --check
      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr133-apply.py .github/workflows/pr133-apply.yml
          git add src/extension/content.ts docs/CAPTURE_SYNC_BOUNDARY.md
          git commit -m 'fix(capture): recognize Maps SPA details and saved lists'
          git push origin HEAD:fix/capture-google-maps-spa
