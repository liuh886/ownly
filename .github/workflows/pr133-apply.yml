name: Apply PR 133

on:
  push:
    branches:
      - fix/capture-google-maps-detection
    paths:
      - '.github/workflows/pr133-apply.yml'
      - '.github/pr133-apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/capture-google-maps-detection
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply Capture repair
        run: python .github/pr133-apply.py

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Capture extension
        run: npm run validate:extension

      - name: Fast repository validation
        run: npm run validate:fast

      - name: Diff sanity
        run: git diff --check

      - name: Commit product implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr133-apply.py .github/workflows/pr133-apply.yml
          git add package.json src/extension/content.ts src/extension/sidepanel/capture.ts src/extension/sidepanel/ui.ts src/extension/saved-list-match.ts src/extension/saved-list-match.test.ts
          git commit -m 'fix(capture): repair Google Maps place and saved-list detection'
          git push origin HEAD:fix/capture-google-maps-detection
