name: Capture identity authority preflight

on:
  push:
    branches:
      - release/preflight-capture-authority
    paths:
      - .github/workflows/capture-identity-authority.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/preflight-capture-authority

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply capture identity authority cleanup
        run: python .github/scripts/capture_identity_authority.py

      - name: Install dependencies
        run: npm ci

      - name: Validate capture authority
        run: |
          npm run validate:fast
          npx vitest run src/domain/place-identity.test.ts src/domain/planner.test.ts src/extension/enrichment.test.ts src/extension/saved-list-match.test.ts src/extension/capture-state.test.ts src/services/PlannerRepository.schedule.test.ts src/services/PlannerRepository.thailand-golden-path.test.ts
          npm run validate:extension

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "ownly-agent"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/capture-identity-authority.yml
          rm .github/scripts/capture_identity_authority.py
          git add src/domain/planner.ts src/domain/planner.test.ts src/extension/enrichment.ts src/extension/enrichment.test.ts src/extension/content.ts docs/PLANNER_CAPTURE_RELEASE_READINESS.md .github/workflows/capture-identity-authority.yml .github/scripts/capture_identity_authority.py
          git commit -m "fix(capture): enforce Place Identity Authority end to end"
          git push origin HEAD:release/preflight-capture-authority
