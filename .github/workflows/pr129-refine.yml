name: Refine PR 129

on:
  push:
    branches:
      - feat/planner-timing-ui-and-prompt-presets
    paths:
      - '.github/workflows/pr129-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feat/planner-timing-ui-and-prompt-presets
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply architecture refinement
        run: |
          python .github/pr129-refine.py
          python .github/pr129-fix-whitespace.py

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Validate MCP package build
        run: |
          npm install --prefix packages/mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/mcp
          node packages/mcp/dist/index.js --help

      - name: Diff sanity
        run: git diff --check

      - name: Commit refined PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AI_PLANNER_MCP.md packages/mcp/package.json packages/mcp/src/index.mjs scripts/mcp/planner-tools.ts server.json src/components/planner/PlaceTimingModal.tsx src/components/planner/PlannerHome.tsx src/domain/planner-schedule.test.ts src/domain/planner-schedule.ts src/domain/planner.test.ts src/domain/planner.ts src/services/PlannerRepository.schedule.test.ts src/services/PlannerRepository.ts tasks/todo.md
          git commit -m 'refactor(planner): unify timing rules and projection boundary'
          git push origin HEAD:feat/planner-timing-ui-and-prompt-presets

      # Trigger marker: 3
