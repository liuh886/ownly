name: Finalize PR 131

on:
  push:
    branches:
      - feat/planner-travel-time-optimization
    paths:
      - '.github/workflows/pr131-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/planner-travel-time-optimization
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply Planner writer boundary fix
        run: python .github/pr131-finalize.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate repository
        run: npm run validate
      - name: Validate MCP package
        run: |
          npm install --prefix packages/mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/mcp
          node packages/mcp/dist/index.js --help
      - name: Diff sanity
        run: git diff --check
      - name: Commit product fix and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr131-finalize.py .github/workflows/pr131-finalize.yml
          git add scripts/shared/ownly-write-service.ts
          git commit -m 'fix(planner): keep Planner writes on Planner serializer'
          git push origin HEAD:feat/planner-travel-time-optimization
