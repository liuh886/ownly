name: Apply PR 133 FX

on:
  push:
    branches:
      - fix/capture-google-maps-detection
    paths:
      - '.github/workflows/pr133-fx-apply.yml'
      - '.github/pr133-fx-apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/capture-google-maps-detection
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply product changes
        run: python .github/pr133-fx-apply.py
      - name: Install locked dependencies
        run: npm ci
      - name: Validate extension
        run: npm run validate:extension
      - name: Fast repository validation
        run: npm run validate:fast
      - name: Diff sanity
        run: git diff --check
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr133-fx-apply.py .github/workflows/pr133-fx-apply.yml
          git add extension/manifest.json scripts/build-extension.mjs src/extension/content.ts src/extension/fx-tooltip.ts docs/CAPTURE_SYNC_BOUNDARY.md
          git commit -m 'fix(capture): restore selection FX and document provider scope'
          git push origin HEAD:fix/capture-google-maps-detection
