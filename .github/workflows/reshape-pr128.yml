name: Reshape PR 128

on:
  push:
    branches:
      - feat/ai-planner-mcp-ical-pro
    paths:
      - scripts/reshape_pr128.py
      - .github/workflows/reshape-pr128.yml

permissions:
  contents: write

jobs:
  reshape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-planner-mcp-ical-pro
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply architecture reshape
        run: python scripts/reshape_pr128.py
      - name: Install dependencies
        run: npm ci
      - name: Validate fast
        run: npm run validate:fast
      - name: Validate shared
        run: npm run validate:shared
      - name: Validate web
        run: npm run validate:web
      - name: Validate Obsidian
        run: npm run validate:obsidian
      - name: Validate extension
        run: npm run validate:extension
      - name: Commit reshaped PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts packages docs tasks
          git commit -m "refactor(planner): make time-aware schedule proposals canonical"
          git push origin HEAD:feat/ai-planner-mcp-ical-pro
