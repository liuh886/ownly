name: Capture data quality refactor

on:
  push:
    branches:
      - refactor/capture-data-quality-20260829

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message == 'chore: bootstrap capture data quality repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply focused Capture data-quality repair
        run: python scripts/apply_capture_data_quality.py
      - name: Validate fast path
        run: npm run validate:fast
      - name: Validate extension
        run: npm run validate:extension
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src extension docs
          git commit -m "feat: harden Capture data quality" || exit 0
          git push origin HEAD:refactor/capture-data-quality-20260829
