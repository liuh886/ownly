name: One-shot final release closeout

on:
  push:
    branches: [release/final-closeout-20260902]
    paths:
      - 'scripts/one-shot-release-closeout.py'
      - 'scripts/one-shot-release-closeout-fix.py'
      - 'scripts/one-shot-release-closeout-fix2.py'
      - '.github/workflows/one-shot-release-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply release closeout
        run: |
          python scripts/one-shot-release-closeout.py
          python scripts/one-shot-release-closeout-fix.py
          python scripts/one-shot-release-closeout-fix2.py
      - name: Release-specific regressions
        run: |
          node scripts/gen-git-sha.mjs
          npx tsc --noEmit
          npx vitest run src/services/PlannerRepository.release-closeout.test.ts src/services/PlannerRepository.capture-import-report.test.ts src/services/PlannerRepository.thailand-golden-path.test.ts src/services/PlannerRepository.schedule.test.ts src/extension/capture-state.test.ts src/extension/capture-import-report.test.ts
      - name: Full release gates
        run: npm run validate
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit validated closeout
        run: |
          git rm .github/workflows/one-shot-release-closeout.yml scripts/one-shot-release-closeout.py scripts/one-shot-release-closeout-fix.py scripts/one-shot-release-closeout-fix2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs
          git commit -m 'fix(release): close final consistency and capture gaps'
          git push origin HEAD:release/final-closeout-20260902
